apiVersion: v1
kind: ConfigMap
metadata:
  name: eip-config
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  NEO4J_URI: bolt://neo4j:7687
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  LLM_PROVIDER: auto
  EMBEDDING_PROVIDER: auto
  CLONE_DEPTH: "500"
  MAX_FILES: "60000"
  PIPELINE_WORKERS: "2"
  ENABLE_OSV: "true"
  ALLOWED_GIT_HOSTS: '["github.com","gitlab.com","bitbucket.org"]'
  CORS_ORIGINS: '["https://eip.example.com"]'
---
# Create the real secret out-of-band (e.g. External Secrets / Sealed Secrets / Vault):
#   kubectl -n eip create secret generic eip-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=NEO4J_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql+psycopg://eip:...@postgres:5432/eip \
#     --from-literal=NEO4J_AUTH=neo4j/... --from-literal=API_KEY=... \
#     --from-literal=OPENAI_API_KEY=... --from-literal=ANTHROPIC_API_KEY=... --from-literal=GITHUB_TOKEN=...
