apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  selector: { app: neo4j }
  ports:
    - { name: bolt, port: 7687 }
    - { name: http, port: 7474 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels: { app: neo4j }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 7474, fsGroup: 7474, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: neo4j
          image: neo4j:5-community
          env:
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: eip-secrets, key: NEO4J_AUTH } }
            - { name: NEO4J_server_memory_heap_max__size, value: 2G }
          ports: [{ containerPort: 7687 }, { containerPort: 7474 }]
          readinessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
