apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eip
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [eip.example.com]
      secretName: eip-tls
  rules:
    - host: eip.example.com
      http:
        paths:
          # Only the frontend is exposed; it proxies /api to the backend and injects the API key.
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
