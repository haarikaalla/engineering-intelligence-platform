apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores-from-backend-only
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [postgres, neo4j, chroma] }]
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: backend } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend-only
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: frontend } } }]
      ports: [{ port: 8000 }]
